<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153d35"><link rel="manifest" href="manifest.webmanifest"><title>Bollnäs Kalender</title><style>body{font:16px system-ui;margin:0;background:#f5f6f3;color:#172b27}header{background:#153d35;color:white;padding:24px max(20px,calc((100vw - 850px)/2))}main{max-width:850px;margin:auto;padding:20px}h1{margin:0}button,select{padding:10px;border:1px solid #ccd5d0;border-radius:9px;background:white}button{cursor:pointer}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.card{background:white;border:1px solid #dfe5e0;border-radius:12px;padding:16px;margin:12px 0}.muted{color:#60736d}.card a{color:#075b49}footer{padding:20px;text-align:center;color:#60736d}</style></head><body><header><h1>Bollnäs Kalender</h1><p>Vad händer i Bollnäs kommun de kommande 14 dagarna?</p></header><main><div class="filters"><label>Kategori <select id="category"><option value="">Alla</option><option>Trav</option><option>Hockey</option><option>Bandy</option><option>Sport</option><option>Musik</option><option>Kultur</option><option>Familj</option><option>Loppis</option><option>Marknad</option><option>Auktion</option><option>Övrigt</option></select></label></div><p id="status" class="muted">Laddar evenemang…</p><section id="events"></section><p>Tips om ett evenemang? <a href="https://github.com/nicholasdekeyser-sudo/Bolln-s-Happenings/issues/new" target="_blank" rel="noopener">Skicka ett tips via GitHub</a>.</p></main><footer>Uppgifter kan ändras. Kontrollera alltid arrangörens sida.</footer><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');let events=[];const el=document.getElementById('events'),status=document.getElementById('status'),cat=document.getElementById('category');function render(){el.replaceChildren();const now=new Date();now.setHours(0,0,0,0);const end=new Date(now);end.setDate(end.getDate()+14);const filtered=events.filter(e=>{const d=new Date(e.start);return d>=now&&d<end&&(!cat.value||e.category===cat.value)}).sort((a,b)=>a.start.localeCompare(b.start));status.textContent=`${filtered.length} evenemang de kommande 14 dagarna · Senast kontrollerad: ${window.updated||'okänd'}`;if(!filtered.length){const p=document.createElement('p');p.textContent='Inga verifierade evenemang hittades i den här kategorin ännu.';el.append(p)}for(const e of filtered){const card=document.createElement('article');card.className='card';const h=document.createElement('h2');h.textContent=e.title;const p=document.createElement('p');p.className='muted';p.textContent=`${new Date(e.start).toLocaleString('sv-SE',{dateStyle:'full',timeStyle:'short'})} · ${e.location||'Plats ej angiven'} · ${e.category}`;const a=document.createElement('a');a.href=e.url;a.target='_blank';a.rel='noopener';a.textContent='Information hos arrangören';card.append(h,p,a);el.append(card)}}cat.addEventListener('change',render);fetch('data/events.json?'+Date.now()).then(r=>r.json()).then(d=>{events=d.events||[];window.updated=d.updated||'okänd';render()}).catch(()=>{status.textContent='Kunde inte läsa evenemang just nu.'});</script></body></html>
